greenBackgroundColor = "rgba(0,0,0,0.28)"
greenTextColor = "#FFFFFF"
grayColor = "#FFFFFF"
grayBackgroundColor = "rgba(0,0,0,0.28)"
grayTextColor = "#FFFFFF"
yellowColor = "#FFD12E"
yellowBackgroundColor = "#FFD12E"
yellowTextColor = "#0E0E10"
