# TGR Haas red / black / white, in two modes. The canvas is black in dark mode
# and white in light mode; red is the accent in both — selected controls, the
# tab underline, primary buttons, the number tiles — and the sidebar rail.
# Surfaces and chart inks for each mode live in app/theme.py; app/theme.css
# paints the page from them.

[theme]
base = "dark"
linkUnderline = true
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
headingFontSizes = ["2.1rem", "1.5rem", "1.15rem", "1rem", "0.9rem", "0.8rem"]
headingFontWeights = [800, 700, 700, 700, 600, 600]
metricValueFontSize = "1.7rem"
metricValueFontWeight = 700

# Dark: black canvas, white text, red accent. The accent is lifted a little
# (#FF2E45) so selected text on its tint clears 4.5:1 against black.
[theme.dark]
backgroundColor = "#0E0E10"
secondaryBackgroundColor = "#1C1C21"
textColor = "#FFFFFF"
primaryColor = "#FF2E45"
linkColor = "#FF2E45"
codeBackgroundColor = "#1C1C21"
codeTextColor = "#FFFFFF"
borderColor = "rgba(255,255,255,0.22)"
dataframeBorderColor = "rgba(255,255,255,0.10)"
dataframeHeaderBackgroundColor = "#1C1C21"
# Badge slots: red = alert, green = ok, gray = info, yellow = flag.
redColor = "#FF2E45"
redBackgroundColor = "#E6002B"
redTextColor = "#FFFFFF"
greenColor = "#FFFFFF"
greenBackgroundColor = "#2A2A31"
greenTextColor = "#FFFFFF"
grayColor = "#B9B9C2"
grayBackgroundColor = "#1C1C21"
grayTextColor = "#D6D6DC"
yellowColor = "#FFD12E"
yellowBackgroundColor = "#FFD12E"
yellowTextColor = "#0E0E10"
blueColor = "#B9B9C2"
blueBackgroundColor = "#1C1C21"
blueTextColor = "#D6D6DC"
orangeColor = "#B9B9C2"
orangeBackgroundColor = "#1C1C21"
orangeTextColor = "#D6D6DC"
violetColor = "#B9B9C2"
violetBackgroundColor = "#1C1C21"
violetTextColor = "#D6D6DC"

# Light: white canvas, black text, the true Haas red as the accent.
[theme.light]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F0F3"
textColor = "#0E0E10"
primaryColor = "#E6002B"
linkColor = "#B30022"
codeBackgroundColor = "#F0F0F3"
codeTextColor = "#0E0E10"
borderColor = "rgba(14,14,16,0.22)"
dataframeBorderColor = "rgba(14,14,16,0.10)"
dataframeHeaderBackgroundColor = "#F0F0F3"
redColor = "#E6002B"
redBackgroundColor = "#E6002B"
redTextColor = "#FFFFFF"
greenColor = "#0E0E10"
greenBackgroundColor = "#E6E6EA"
greenTextColor = "#0E0E10"
grayColor = "#6B6B75"
grayBackgroundColor = "#F0F0F3"
grayTextColor = "#3A3A44"
yellowColor = "#D9A800"
yellowBackgroundColor = "#FFD12E"
yellowTextColor = "#0E0E10"
blueColor = "#6B6B75"
blueBackgroundColor = "#F0F0F3"
blueTextColor = "#3A3A44"
orangeColor = "#6B6B75"
orangeBackgroundColor = "#F0F0F3"
orangeTextColor = "#3A3A44"
violetColor = "#6B6B75"
violetBackgroundColor = "#F0F0F3"
violetTextColor = "#3A3A44"

# The sidebar is the red rail in both modes: white text and controls, alerts
# inverted to white-on-red so they still stand out on red.
[theme.dark.sidebar]
backgroundColor = "#E6002B"
secondaryBackgroundColor = "#B30022"
textColor = "#FFFFFF"
primaryColor = "#FFFFFF"
linkColor = "#FFFFFF"
codeBackgroundColor = "#B30022"
codeTextColor = "#FFFFFF"
borderColor = "rgba(255,255,255,0.38)"
redColor = "#E6002B"
redBackgroundColor = "#FFFFFF"
redTextColor = "#E6002B"
greenColor = "#FFFFFF"
greenBackgroundColor = "rgba(0,0,0,0.28)"
greenTextColor = "#FFFFFF"
grayColor = "#FFFFFF"
grayBackgroundColor = "rgba(0,0,0,0.28)"
grayTextColor = "#FFFFFF"
yellowColor = "#FFD12E"
yellowBackgroundColor = "#FFD12E"
yellowTextColor = "#0E0E10"

[theme.light.sidebar]
backgroundColor = "#E6002B"
secondaryBackgroundColor = "#B30022"
textColor = "#FFFFFF"
